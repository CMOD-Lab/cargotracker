apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cargo-tracker-ingress
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "cargo-tracker-ip"
    networking.gke.io/managed-certificates: "cargo-tracker-cert"
spec:
  rules:
    - host: cargo-tracker.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cargo-tracker-service
                port:
                  number: 80
