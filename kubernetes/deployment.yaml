apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    version: "3.1-SNAPSHOT"
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-tracker
  template:
    metadata:
      labels:
        app: cargo-tracker
        version: "3.1-SNAPSHOT"
        component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: cargo-tracker
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 4848
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UnlockExperimentalVMOptions -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
            - name: APP_SERVER
              value: "payara"
            - name: GRAPH_TRAVERSAL_URL
              value: "{{GRAPH_TRAVERSAL_URL}}"
            - name: DB_DRIVER_CLASS
              value: "{{DB_DRIVER_CLASS}}"
            - name: DB_JDBC_URL
              value: "{{DB_JDBC_URL}}"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cargo-tracker-db-secret
                  key: db-user
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cargo-tracker-db-secret
                  key: db-password
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /cargo-tracker/rest/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /cargo-tracker/rest/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: cargo-tracker-data
              mountPath: /opt/payara/cargo-tracker-data
      volumes:
        - name: cargo-tracker-data
          emptyDir: {}
      terminationGracePeriodSeconds: 60
      restartPolicy: Always
