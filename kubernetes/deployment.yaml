apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    version: "3.1"
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-tracker
  template:
    metadata:
      labels:
        app: cargo-tracker
        version: "3.1"
    spec:
      containers:
        - name: cargo-tracker
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # JVM settings
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Xmx512m"
            - name: TZ
              value: "UTC"
            - name: LANG
              value: "en_US.UTF-8"
            # PostgreSQL / RDS connection
            - name: POSTGRESQL_JDBC_URL
              value: "{{POSTGRESQL_JDBC_URL}}"
            - name: POSTGRESQL_USERNAME
              value: "{{POSTGRESQL_USERNAME}}"
            - name: POSTGRESQL_PASSWORD
              value: "{{POSTGRESQL_PASSWORD}}"
            # Redis / ElastiCache connection
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_PASSWORD
              value: "{{REDIS_PASSWORD}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /rest/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /rest/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: cargo-tracker-data
              mountPath: /opt/payara/cargo-tracker-data
      volumes:
        - name: cargo-tracker-data
          emptyDir: {}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
