apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    version: "3.1-SNAPSHOT"
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-tracker
  template:
    metadata:
      labels:
        app: cargo-tracker
        version: "3.1-SNAPSHOT"
        component: backend
    spec:
      containers:
        - name: cargo-tracker
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8081
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UnlockExperimentalVMOptions"
            - name: POSTGRES_HOST
              value: "{{POSTGRES_HOST}}"
            - name: POSTGRES_PORT
              value: "{{POSTGRES_PORT}}"
            - name: POSTGRES_DB
              value: "{{POSTGRES_DB}}"
            - name: POSTGRES_USER
              value: "{{POSTGRES_USER}}"
            - name: POSTGRES_PASSWORD
              value: "{{POSTGRES_PASSWORD}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: cargo-tracker-data
              mountPath: /opt/payara/data
      volumes:
        - name: cargo-tracker-data
          emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
