version: "3.9"

services:
  cargo-tracker:
    image: cargo-tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cargo-tracker
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - TZ=UTC
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - DB_DRIVER_CLASS=org.postgresql.ds.PGPoolingDataSource
      - DB_JDBC_URL=jdbc:postgresql://host.docker.internal:5432/cargotracker
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GRAPH_TRAVERSAL_URL=http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path
    volumes:
      - cargo-tracker-data:/opt/payara/cargo-tracker-data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
