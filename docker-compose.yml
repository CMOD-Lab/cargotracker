version: '3.8'

# Eclipse Cargo Tracker - Application Service Only
# External services (PostgreSQL) must be provided separately via environment variables.
# Build the cloud profile WAR before running:
#   mvn clean package -Pcloud -DskipTests \
#       -DpostgreSqlJdbcUrl="jdbc:postgresql://<DB_HOST>:5432/<DB_NAME>" \
#       -DpostgreSqlUsername="<DB_USER>" -DpostgreSqlPassword="<DB_PASSWORD>"

services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-tracker:latest
    container_name: cargo-tracker-app
    ports:
      - "8080:8080"
    environment:
      # JVM Options
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      TZ: "UTC"
      # Database connection (provide external PostgreSQL details)
      DB_HOST: "${DB_HOST:-localhost}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-postgres}"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      # Application configuration
      GRAPH_TRAVERSAL_URL: "${GRAPH_TRAVERSAL_URL:-http://localhost:8080/rest/graph-traversal/shortest-path}"
    volumes:
      - cargo-tracker-data:/opt/payara/cargo-tracker-data
    restart: unless-stopped
    networks:
      - app-network

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
