version: "3.9"

services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-tracker:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
      - "4848:4848"
    environment:
      - TZ=UTC
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Xmx512m -Dfile.encoding=UTF-8
      - APP_SERVER=payara
      - GRAPH_TRAVERSAL_URL=http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path
      - DB_DRIVER_CLASS=org.h2.jdbcx.JdbcDataSource
      - DB_JDBC_URL=jdbc:h2:file:./cargo-tracker-data/cargo-tracker-database
      - DB_USER=
      - DB_PASSWORD=
    volumes:
      - cargo-tracker-data:/opt/payara/cargo-tracker-data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/payara/glassfish/domains/domain1/autodeploy/cargo-tracker.war_deployed || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
