version: "3.8"

services:
  cargo-tracker:
    image: cargo-tracker:latest
    container_name: cargo-tracker
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - POSTGRESQL_JDBC_URL=${POSTGRESQL_JDBC_URL:-jdbc:postgresql://localhost:5432/cargotracker}
      - POSTGRESQL_USERNAME=${POSTGRESQL_USERNAME:-postgres}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD:-postgres}
    volumes:
      - cargo-tracker-data:/opt/cargo-tracker-data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
