version: "3.8"

services:
  cargo-tracker:
    image: cargo-tracker:latest
    container_name: cargo-tracker-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "4848:4848"
    environment:
      # JVM tuning for containerized environment
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UnlockExperimentalVMOptions"
      TZ: "UTC"
      LANG: "en_US.UTF-8"
      # Application configuration - override as needed
      GRAPH_TRAVERSAL_URL: "http://localhost:8080/rest/graph-traversal/shortest-path"
      # Database configuration (H2 embedded by default; override for external DB)
      DB_DRIVER_CLASS: "org.h2.jdbcx.JdbcDataSource"
      DB_JDBC_URL: "jdbc:h2:file:./cargo-tracker-data/cargo-tracker-database"
      DB_USER: ""
      DB_PASSWORD: ""
    volumes:
      - cargo-tracker-data:/opt/payara/data
      - ./logs:/opt/payara/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/rest/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
