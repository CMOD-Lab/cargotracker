version: "3.8"

services:
  cargo-tracker:
    image: cargo-tracker:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
      - "8181:8181"
      - "4848:4848"
    environment:
      - TZ=UTC
      - LANG=en_US.UTF-8
      - DB_JDBC_URL=${DB_JDBC_URL:-jdbc:h2:file:./cargo-tracker-data/cargo-tracker-database}
      - DB_DRIVER_CLASS=${DB_DRIVER_CLASS:-org.h2.jdbcx.JdbcDataSource}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - GRAPH_TRAVERSAL_URL=${GRAPH_TRAVERSAL_URL:-http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path}
    volumes:
      - cargo-tracker-data:/opt/payara/cargo-tracker-data
      - cargo-tracker-logs:/opt/payara/glassfish/domains/domain1/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/payara/glassfish/domains/domain1/autodeploy/cargo-tracker.war_deployed || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  cargo-tracker-data:
    driver: local
  cargo-tracker-logs:
    driver: local

networks:
  app-network:
    driver: bridge
