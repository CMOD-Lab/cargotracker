version: '3.8'

services:
  cargo-tracker:
    image: cargo-tracker:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:+UnlockExperimentalVMOptions -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
      SPRING_PROFILES_ACTIVE: docker
      POSTGRESQL_JDBC_URL: ${POSTGRESQL_JDBC_URL:-jdbc:postgresql://host.docker.internal:5432/cargotracker}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-cargotracker}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-changeit}
      GRAPH_TRAVERSAL_URL: ${GRAPH_TRAVERSAL_URL:-http://host.docker.internal:8080/rest/graph-traversal/shortest-path}
    volumes:
      - ./config:/opt/cargo-tracker/config:ro
      - ./secrets:/opt/cargo-tracker/secrets:ro
      - cargo-tracker-data:/opt/cargo-tracker/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  cargo-tracker-data:

networks:
  app-network:
    driver: bridge
