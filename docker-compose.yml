version: "3.9"

# Eclipse Cargo Tracker - Docker Compose (Application Only)
# NOTE: This file contains ONLY the application service.
# External services (PostgreSQL, etc.) must be provided separately.
# Use environment variables to configure external service connections.

services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-tracker:latest
    container_name: cargo-tracker-app
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      # JVM Options
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      # Timezone
      - TZ=UTC
      # Database configuration (override for external DB)
      # For H2 (default/dev): leave DB_JDBC_URL unset or use H2 file path
      # For PostgreSQL (cloud): set the following variables
      - DB_JDBC_URL=${DB_JDBC_URL:-jdbc:h2:file:./cargo-tracker-data/cargo-tracker-database}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # Graph traversal service URL
      - GRAPH_TRAVERSAL_URL=${GRAPH_TRAVERSAL_URL:-http://localhost:8080/rest/graph-traversal/shortest-path}
    volumes:
      # Persist H2 database and application data
      - cargo-tracker-data:/opt/payara/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "java -cp /opt/payara/payara-micro.jar fish.payara.micro.PayaraMicro --help > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
