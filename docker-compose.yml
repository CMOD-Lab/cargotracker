version: "3.8"

services:
  cargo-tracker:
    image: cargo-tracker:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
      - "4848:4848"
    environment:
      - TZ=UTC
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - GRAPH_TRAVERSAL_URL=http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path
      - DB_JDBC_URL=jdbc:h2:file:./cargo-tracker-data/cargo-tracker-database
      - DB_USER=
      - DB_PASSWORD=
    volumes:
      - cargo-tracker-data:/opt/payara/cargo-tracker-data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
