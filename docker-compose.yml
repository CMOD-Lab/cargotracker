version: "3.9"

services:
  cargo-tracker:
    image: cargo-tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cargo-tracker
    ports:
      - "8080:8080"
    environment:
      # JVM tuning
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      TZ: "UTC"
      LANG: "en_US.UTF-8"
      # Database configuration (H2 embedded by default; override for external DB)
      DB_DRIVER_CLASS: "${DB_DRIVER_CLASS:-org.h2.jdbcx.JdbcDataSource}"
      DB_JDBC_URL: "${DB_JDBC_URL:-jdbc:h2:file:./cargo-tracker-data/cargo-tracker-database}"
      DB_USER: "${DB_USER:-}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      # Application settings
      GRAPH_TRAVERSAL_URL: "${GRAPH_TRAVERSAL_URL:-http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path}"
      SEND_ERROR_IN_RESPONSE: "${SEND_ERROR_IN_RESPONSE:-true}"
    volumes:
      - cargo-tracker-data:/opt/payara/cargo-tracker-data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "java -cp /opt/payara/payara-micro.jar fish.payara.micro.PayaraMicro --help > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
